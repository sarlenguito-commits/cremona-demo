<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6F9572">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Cremona Coffee & Brunch · la app del equipo: salón, cocina, caja y tareas (demo con datos de prueba).">
    <title>Cremona Coffee & Brunch · Equipo (demo)</title>
    <!-- Vista previa al compartir el link (WhatsApp) -->
    <meta property="og:title" content="Cremona Coffee & Brunch · app del equipo (demo)">
    <meta property="og:description" content="Salón, comandas, cocina, caja y tareas del equipo de Cremona. Datos de prueba: probala sin miedo.">
    <meta property="og:image" content="https://sarlenguito-commits.github.io/cremona-demo/assets/img/compartir.jpg">
    <meta property="og:type" content="website">
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/img/icono-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <!-- Aplica el tema guardado antes de dibujar la página (evita un parpadeo claro/oscuro) -->
    <script>
        try { const t = localStorage.getItem("cr-tema"); if (t) document.documentElement.dataset.tema = t; } catch {}
    </script>
</head>

        <p class="cargando">Cargando…</p>
    </div>
    <script type="module" src="js/app.js"></script>
